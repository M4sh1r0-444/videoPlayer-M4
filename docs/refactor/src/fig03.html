<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图3 布局与信息架构</title>
<link rel="stylesheet" href="styles.css">
<style>
  .wf-wrap { display: flex; flex-direction: column; gap: 8px; }
  .wf-cap { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .wf-cap b { font-size: 13px; }
  .wf-cap .muted { font-size: 11px; }
  .wf {
    position: relative; height: 356px; border-radius: 10px; overflow: hidden;
    background: #0e1218; border: 1px solid #223047;
    display: flex; flex-direction: column; color: #cbd5e1;
  }
  .wf .top { height: 24px; flex: none; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: #151b24; border-bottom: 1px solid #232c3a; }
  .wf .tnav { width: 34px; height: 9px; border-radius: 2px; background: #2a3546; }
  .wf .tsearch { flex: 1; height: 12px; border-radius: 3px; background: #101722; border: 1px solid #223047; }
  .wf .tchip { width: 26px; height: 10px; border-radius: 2px; background: #1d2a44; }
  .wf .tbtn { width: 22px; height: 11px; border-radius: 2px; background: #1c2431; border: 1px solid #2a3546; }
  .wf .tbtn.pri { width: 30px; background: #2f6ff2; border-color: #2f6ff2; }
  .wf .body { flex: 1; display: flex; min-height: 0; }
  .wf .nav { flex: none; background: #121821; border-right: 1px solid #232c3a; padding: 5px; }
  .wf .nav .hd { height: 5px; width: 46px; background: #223047; border-radius: 2px; margin: 2px 2px 7px; }
  .wf .nav .it { height: 11px; border-radius: 3px; background: #1a2230; margin: 3px 0; }
  .wf .nav .it.on { background: #24365c; }
  .wf .nav .it.sub { background: transparent; height: 9px; width: 54%; margin-left: 6px; }
  .wf .list { flex: none; background: #121821; border-right: 1px solid #232c3a; padding: 5px 4px; }
  .wf .list .hd { height: 9px; border-radius: 2px; background: #1a2230; margin-bottom: 6px; }
  .wf .row1 { height: 13px; border-radius: 2px; background: #1a2230; margin: 3px 0; display: flex; align-items: center; gap: 3px; padding: 0 4px; }
  .wf .row1.on { background: #24365c; }
  .wf .row1 i { height: 5px; border-radius: 2px; background: #2b3a52; display: block; }
  .wf .row1 i.t { width: 58%; }
  .wf .row1 i.p { width: 18%; }
  .wf .row1 .ok { color: #3ecf8e; font-size: 7px; line-height: 1; }
  .wf .row2 { height: 21px; border-radius: 3px; background: #1a2230; margin: 3px 0; padding: 3px 4px; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .wf .row2.on { background: #24365c; }
  .wf .row2 i { height: 4px; border-radius: 2px; background: #2b3a52; display: block; }
  .wf .row2 i.t { width: 82%; }
  .wf .row2 i.m { width: 46%; height: 3px; background: #223047; }
  .wf .player { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #05070a; }
  .wf .video { flex: 1; position: relative; background: radial-gradient(circle at 50% 45%, #131a24 0, #05070a 62%); }
  .wf .play { position: absolute; left: 50%; top: 50%; width: 0; height: 0; border-left: 9px solid #334155; border-top: 6px solid transparent; border-bottom: 6px solid transparent; transform: translate(-50%, -50%); }
  .wf .ov { position: absolute; inset: 8% 10%; border: 1px dashed #223047; border-radius: 4px; }
  .wf .bar { height: 18px; flex: none; background: #151b24; border-top: 1px solid #232c3a; display: flex; align-items: center; gap: 4px; padding: 0 6px; }
  .wf .bar .b { width: 8px; height: 8px; border-radius: 2px; background: #2a3546; }
  .wf .bar .line { flex: 1; height: 3px; border-radius: 2px; background: #223047; position: relative; }
  .wf .bar .fill { position: absolute; left: 0; top: 0; height: 3px; width: 38%; background: #2f6ff2; border-radius: 2px; }
  .wf .dock { flex: none; background: #121821; border-left: 1px solid #232c3a; padding: 5px; }
  .wf .dock .tabs { display: flex; gap: 3px; margin-bottom: 6px; }
  .wf .dock .tab { flex: 1; height: 10px; border-radius: 2px; background: #1a2230; }
  .wf .dock .tab.on { background: #24365c; }
  .wf .dock .bub { height: 26px; border-radius: 4px; background: #1a2230; margin: 4px 0; }
  .wf .dock .bub.me { background: #24365c; margin-left: 18%; }
  .wf .dock .inp { height: 12px; border-radius: 3px; background: #101722; border: 1px solid #223047; margin-top: 5px; }
  .wf .rail { flex: none; width: 30px; background: #121821; border-right: 1px solid #232c3a; padding: 5px 4px; display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .wf .rail .ic { width: 14px; height: 14px; border-radius: 3px; background: #1a2230; }
  .wf .rail .ic.on { background: #24365c; }
  .wf .overlay { position: absolute; right: 0; top: 24px; bottom: 0; width: 40%; background: #121821; border-left: 1px solid #2f6ff2; box-shadow: -12px 0 24px rgba(0,0,0,.45); padding: 6px; }
  .wf .overlay .tab { height: 10px; border-radius: 2px; background: #24365c; margin-bottom: 6px; }
  .wf .overlay .bub { height: 24px; border-radius: 4px; background: #1a2230; margin: 4px 0; }
  .wf .zero { flex: none; width: 2px; background: #ef4444; }
  .wf .zero-label {
    position: absolute; left: 314px; top: 32px; z-index: 3;
    background: #ef4444; color: #fff; font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 3px; letter-spacing: .5px;
  }

  .dims { display: flex; flex-wrap: wrap; gap: 6px; }
  .dim { font-size: 10.5px; color: #475569; background: #fff; border: 1px solid #d8e0ea; border-radius: 999px; padding: 3px 8px; }
  .dim b { color: #0f172a; }
  .dim.bad { color: #b42318; border-color: #f4c6ca; background: #fdf3f4; }
  .dim.bad b { color: #b42318; }
  .callout { display: flex; gap: 6px; font-size: 10.5px; line-height: 1.55; color: #b42318; }
  .callout .mark { flex: none; width: 14px; height: 14px; border-radius: 3px; background: #fdecee; border: 1px solid #f4c6ca; color: #b42318; font-size: 9px; display: flex; align-items: center; justify-content: center; }
  .callout.good { color: #0b7a4b; }
  .callout.good .mark { background: #e7f6ef; border-color: #bfe5d1; color: #0b7a4b; }
  table.bt { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 4px; }
  table.bt th { text-align: left; color: #64748b; font-weight: 600; padding: 6px 8px; background: #f1f5f9; border-bottom: 1px solid #dde5ef; }
  table.bt td { padding: 6px 8px; border-bottom: 1px solid #e7edf5; color: #334155; }
  table.bt td b { color: #0f172a; }
  .bp-note { font-size: 11px; color: #475569; line-height: 1.7; }
  .bp-note b { color: #0f172a; }
</style>
</head>
<body>
<div id="zoom">
<figure class="fig">
  <header class="fig-head">
    <div class="kicker">图 3 · 页面骨架</div>
    <h1>播放器优先：三栏让位给「导航 + 列表 + 播放 + 停靠」</h1>
    <p class="sub">现状所有栏宽都是固定 px、且没有断点；目标是「播放器有保底宽度、侧栏可折叠、窄窗把右侧改成浮层」——同一套 DOM，三档断点</p>
  </header>

  <div class="stage">
    <div class="row" style="align-items:flex-start">
      <div class="wf-wrap" style="flex:1">
        <div class="wf-cap"><b>现状 · 1344 × 821</b><span class="muted">三栏固定宽度，AI 侧栏是第四栏</span></div>
        <div class="wf">
          <div class="top">
            <div class="tnav"></div><div class="tsearch"></div>
            <div class="tchip"></div><div class="tbtn"></div><div class="tbtn pri"></div><div class="tbtn"></div>
          </div>
          <div class="body">
            <div class="nav" style="width:12.7%">
              <div class="hd"></div>
              <div class="it on"></div><div class="it"></div><div class="it"></div><div class="it sub"></div>
            </div>
            <div class="list" style="width:23.8%">
              <div class="hd"></div>
              <div class="row1 on"><span class="ok">✔</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">✔</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">✔</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">▶</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
            </div>
            <div class="player">
              <div class="video"><div class="ov"></div><div class="play"></div></div>
              <div class="bar"><div class="b"></div><div class="b"></div><div class="line"><div class="fill"></div></div><div class="b"></div></div>
            </div>
          </div>
        </div>
        <div class="dims">
          <span class="dim">导航 <b>170</b></span><span class="dim">列表 <b>320</b></span><span class="dim">播放器 <b>856</b></span><span class="dim">标题可用宽 <b>109</b></span>
        </div>
        <div class="callout"><span class="mark">!</span><div>AI 侧栏（620px）打开后播放器只剩 <b>237px</b>；在应用自己的最小窗宽 980px 下，播放器被压到 <b>0px</b>，AI 面板右侧超出窗口。</div></div>
        <div class="callout"><span class="mark">!</span><div>99 行分集里 <b>83 行</b>标题被截断——每行塞了状态、序号、标题、时长/百分比、讲义、打开 6 个元素。</div></div>
      </div>

      <div class="wf-wrap" style="flex:1">
        <div class="wf-cap"><b>目标 · 1344 宽</b><span class="muted">导航可折叠，停靠区可收起</span></div>
        <div class="wf">
          <div class="top">
            <div class="tnav"></div><div class="tsearch"></div>
            <div class="tchip"></div><div class="tbtn"></div><div class="tbtn"></div><div class="tbtn pri"></div>
          </div>
          <div class="body">
            <div class="nav" style="width:17.3%">
              <div class="hd"></div>
              <div class="it on"></div><div class="it"></div><div class="it"></div><div class="it"></div><div class="it sub"></div>
            </div>
            <div class="list" style="width:22.3%">
              <div class="hd"></div>
              <div class="row2 on"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
            </div>
            <div class="player">
              <div class="video"><div class="ov"></div><div class="play"></div></div>
              <div class="bar"><div class="b"></div><div class="b"></div><div class="line"><div class="fill"></div></div><div class="b"></div></div>
            </div>
            <div class="dock" style="width:25.3%">
              <div class="tabs"><div class="tab on"></div><div class="tab"></div><div class="tab"></div></div>
              <div class="bub me"></div><div class="bub"></div><div class="bub"></div><div class="bub me"></div>
              <div class="inp"></div>
            </div>
          </div>
        </div>
        <div class="dims">
          <span class="dim">导航 <b>232</b>（可折）</span><span class="dim">列表 <b>304</b></span><span class="dim">播放器 <b>≥420</b></span><span class="dim">停靠 <b>340</b></span>
        </div>
        <div class="callout good"><span class="mark">✓</span><div>分集行改两行式：标题占满整行（≥ 220px），时长/进度/讲义降为第二行元信息；「打开」收进悬停操作，标题截断率从 84% 降到 0。</div></div>
        <div class="callout good"><span class="mark">✓</span><div>停靠区把「讲义 / AI / 笔记」合并成带页签的同一块，宽度由容器查询钳制；播放器低于保底宽度时自动把停靠区变成浮层。</div></div>
      </div>
    </div>

    <div class="row" style="margin-top:22px; align-items:flex-start">
      <div class="wf-wrap" style="flex:1">
        <div class="wf-cap"><b>现状 · 980 宽 + 打开 AI（实测故障）</b><span class="muted">播放器被压到 0，AI 面板越出右缘</span></div>
        <div class="wf" style="height:300px">
          <div class="zero-label">播放器 0px</div>
          <div class="top">
            <div class="tnav"></div><div class="tsearch"></div>
            <div class="tchip"></div><div class="tbtn"></div><div class="tbtn pri"></div>
          </div>
          <div class="body">
            <div class="nav" style="width:17.3%">
              <div class="hd"></div>
              <div class="it on"></div><div class="it"></div><div class="it"></div><div class="it sub"></div>
            </div>
            <div class="list" style="width:32.7%">
              <div class="hd"></div>
              <div class="row1 on"><span class="ok">✔</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">✔</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">▶</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
              <div class="row1"><span class="ok">·</span><i class="t"></i><i class="p"></i></div>
            </div>
            <div class="zero"></div>
            <div class="dock" style="width:63.3%">
              <div class="tabs"><div class="tab on"></div><div class="tab"></div><div class="tab"></div></div>
              <div class="bub me"></div><div class="bub"></div><div class="bub"></div>
              <div class="inp"></div>
            </div>
          </div>
        </div>
        <div class="dims">
          <span class="dim">导航 <b>170</b></span><span class="dim">列表 <b>320</b></span><span class="dim bad">播放器 <b>0</b></span><span class="dim bad">AI <b>620（越界 127）</b></span>
        </div>
        <div class="callout"><span class="mark">!</span><div>这是应用自身最小窗宽下的真实结果：<span class="mono">#main</span> 的 flex 子项被 AI 面板挤到 0，主区 <span class="mono">scrollWidth 1107 &gt; 980</span>，右侧 127px 不可见。</div></div>
      </div>

      <div class="wf-wrap" style="flex:1">
        <div class="wf-cap"><b>目标 · 980 宽（应用最小窗口）</b><span class="muted">导航收成图标轨，停靠区改为浮层抽屉</span></div>
        <div class="wf" style="height:300px">
          <div class="top">
            <div class="tnav"></div><div class="tsearch"></div>
            <div class="tchip"></div><div class="tbtn"></div><div class="tbtn pri"></div>
          </div>
          <div class="body">
            <div class="rail">
              <div class="ic on"></div><div class="ic"></div><div class="ic"></div><div class="ic"></div>
            </div>
            <div class="list" style="width:28%">
              <div class="hd"></div>
              <div class="row2 on"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
              <div class="row2"><i class="t"></i><i class="m"></i></div>
            </div>
            <div class="player">
              <div class="video"><div class="ov"></div><div class="play"></div></div>
              <div class="bar"><div class="b"></div><div class="b"></div><div class="line"><div class="fill"></div></div><div class="b"></div></div>
            </div>
            <div class="overlay">
              <div class="tab"></div>
              <div class="bub"></div><div class="bub"></div><div class="bub"></div>
            </div>
          </div>
        </div>
        <div class="dims">
          <span class="dim">图标轨 <b>64</b></span><span class="dim">列表 <b>280</b></span><span class="dim">播放器 <b>636</b></span><span class="dim">停靠 <b>浮层 360</b></span>
        </div>
        <div class="callout good"><span class="mark">✓</span><div>浮层不参与 flex 分配（<span class="mono">position:fixed; right:0</span> + 半透明背板），播放器宽度不变；Esc / 点击背板关闭，焦点回到播放器。</div></div>
      </div>
    </div>

    <div class="card" style="margin-top:16px">
      <div class="row" style="gap:26px; align-items:flex-start">
        <div style="flex:1.1">
          <div class="c-title"><span>断点规则（写进 layout.css）</span></div>
          <table class="bt">
            <tr><th>窗口宽度</th><th>导航</th><th>分集列表</th><th>播放器</th><th>停靠区</th></tr>
            <tr><td><b>≥ 1280</b></td><td>232</td><td>304</td><td>自适应，≥420</td><td>常驻 340</td></tr>
            <tr><td><b>1024–1279</b></td><td>64 图标轨</td><td>288</td><td>≥420</td><td>可收起 300</td></tr>
            <tr><td><b>&lt; 1024</b></td><td>64 抽屉</td><td>272</td><td>≥420</td><td>浮层 360</td></tr>
          </table>
          <div class="bp-note" style="margin-top:10px">实现：<span class="mono">#main { container-type: inline-size }</span> + <span class="mono">@container (max-width: 1100px)</span>。不再用 JS 计算「其余两栏现宽 + 3 根把手 + 320」，也不用 ResizeObserver 兜底。</div>
        </div>
        <div style="flex:.9">
          <div class="c-title"><span>配套约定</span></div>
          <div class="bp-note" style="margin-top:9px">
            <b>折叠可持久化</b>：<span class="mono">settings.panelWidths</span> 增加 <span class="mono">collapsed</span> 字段，旧数据缺省即展开，向后兼容。<br>
            <b>键盘可达</b>：分隔条可聚焦，←→ 每次 16px、双击复位；折叠按钮常驻 tab 序并带 <span class="mono">aria-expanded</span>。<br>
            <b>不引入栅格库</b>：断点值集中在 <span class="mono">tokens.css</span>，布局只用 flex + 两条容器查询，避免「12 栅格」式的过度抽象。
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="footnote">线框为结构示意，非最终视觉稿：颜色、圆角、间距沿用现有 tokens（<span class="mono">--bg2 / --line / --accent</span>），改造不追求换皮，只调整信息层级与空间分配。</p>
</figure>
</div>

</body>
